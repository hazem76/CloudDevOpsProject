apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{APP_NAME}}-deployment
  namespace: ivolve
  labels:
    app: {{APP_NAME}}
    component: microservice
    environment: {{ENVIRONMENT}}
spec:
  replicas: {{REPLICAS}}
  selector:
    matchLabels:
      app: {{APP_NAME}}
  template:
    metadata:
      labels:
        app: {{APP_NAME}}
        component: microservice
    spec:
      containers:
        - name: {{APP_NAME}}
          image: {{IMAGE_NAME}}:{{IMAGE_TAG}}
          ports:
            - containerPort: {{CONTAINER_PORT}}
              name: http
          envFrom:
            - configMapRef:
                name: ivolve-config
            - secretRef:
                name: ivolve-secrets
          env:
            - name: APP_NAME
              value: {{APP_NAME}}
            - name: ENVIRONMENT
              value: {{ENVIRONMENT}}
          readinessProbe:
            httpGet:
              path: {{HEALTH_CHECK_PATH}}
              port: {{CONTAINER_PORT}}
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: {{HEALTH_CHECK_PATH}}
              port: {{CONTAINER_PORT}}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: {{CPU_REQUEST}}
              memory: {{MEMORY_REQUEST}}
            limits:
              cpu: {{CPU_LIMIT}}
              memory: {{MEMORY_LIMIT}}
      imagePullSecrets:
        - name: ecr-registry-secret