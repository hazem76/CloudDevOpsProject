---
# Jenkins node role - Install Java, Jenkins LTS, Docker, and Trivy

- name: Install Java OpenJDK 17 JRE
  apt:
    name: openjdk-17-jre
    state: present
    update_cache: yes

- name: Add Jenkins GPG key
  apt_key:
    url: https://pkg.jenkins.io/debian-stable/jenkins.io.key
    state: present
    keyring: /usr/share/keyrings/jenkins-keyring.asc

- name: Add Jenkins apt repository
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
    state: present
    filename: jenkins

- name: Install Jenkins LTS
  apt:
    name: jenkins
    state: present
    update_cache: yes

- name: Configure Jenkins HTTP port
  lineinfile:
    path: /etc/default/jenkins
    regexp: '^HTTP_PORT='
    line: "HTTP_PORT={{ jenkins_port }}"
  notify: restart jenkins

- name: Start and enable Jenkins service
  service:
    name: jenkins
    state: started
    enabled: yes

- name: Wait for Jenkins to be ready
  wait_for:
    port: "{{ jenkins_port }}"
    delay: 30
    timeout: 300

- name: Install Docker
  apt:
    name:
      - docker.io
      - docker-compose
    state: present
    update_cache: yes

- name: Start and enable Docker service
  service:
    name: docker
    state: started
    enabled: yes

- name: Add ubuntu user to docker group
  user:
    name: ubuntu
    groups: docker
    append: yes

- name: Install Trivy binary
  block:
    - name: Download Trivy
      get_url:
        url: "https://github.com/aquasecurity/trivy/releases/download/{{ trivy_version }}/trivy_{{ trivy_version | regex_replace('^v', '') }}_linux_amd64.tar.gz"
        dest: "/tmp/trivy.tar.gz"
        mode: '0644'

    - name: Extract Trivy
      unarchive:
        src: "/tmp/trivy.tar.gz"
        dest: /usr/local/bin
        remote_src: yes
        creates: "/usr/local/bin/trivy"

    - name: Set Trivy executable permissions
      file:
        path: /usr/local/bin/trivy
        mode: '0755'

  rescue:
    - name: Install Trivy via apt fallback
      apt:
        name: trivy
        state: present

- name: Verify Trivy installation
  command: trivy --version
  register: trivy_version_output
  changed_when: false

- name: Display Trivy version
  debug:
    msg: "Trivy version: {{ trivy_version_output.stdout_lines[0] if trivy_version_output.stdout_lines else 'not found' }}"